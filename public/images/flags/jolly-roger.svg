<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B101D" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B849" />
      <stop offset="50%" stop-color="#D9A036" />
      <stop offset="100%" stop-color="#B88220" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flag Background Outer Box -->
  <rect width="800" height="500" rx="12" fill="url(#flagGrad)" stroke="#D9A036" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Inner Decorative Naval Border -->
  <rect x="20" y="20" width="760" height="460" rx="8" fill="none" stroke="#D9A036" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Compass Rose Central Backdrop -->
  <g transform="translate(400, 250)" opacity="0.15">
    <circle r="160" fill="none" stroke="#D9A036" stroke-width="3"/>
    <circle r="120" fill="none" stroke="#D9A036" stroke-width="1.5"/>
    <path d="M0 -180 L20 -40 L180 0 L40 20 L0 180 L-20 40 L-180 0 L-40 -20 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Crossed Cutlasses / Bones -->
  <g transform="translate(400, 280)" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round">
    <line x1="-140" y1="-90" x2="140" y2="90" />
    <line x1="140" y1="-90" x2="-140" y2="90" />
  </g>

  <!-- Naval Skull Emblem -->
  <g transform="translate(400, 210)" fill="url(#goldGrad)" filter="url(#glow)">
    <!-- Skull Cranium -->
    <path d="M-50 -30 C-50 -75 50 -75 50 -30 C50 -10 40 10 30 25 L-30 25 C-40 10 -50 -10 -50 -30 Z" />
    <!-- Jaw and Teeth -->
    <path d="M-22 25 L22 25 L18 45 L-18 45 Z" />
    <!-- Tooth Divs -->
    <line x1="-10" y1="25" x2="-10" y2="45" stroke="#0B101D" stroke-width="3"/>
    <line x1="0" y1="25" x2="0" y2="45" stroke="#0B101D" stroke-width="3"/>
    <line x1="10" y1="25" x2="10" y2="45" stroke="#0B101D" stroke-width="3"/>
    <!-- Eye Sockets -->
    <circle cx="-20" cy="-25" r="14" fill="#0B101D" />
    <circle cx="20" cy="-25" r="14" fill="#0B101D" />
    <!-- Nose Cavity -->
    <polygon points="0,-10 -7,5 7,5" fill="#0B101D" />
  </g>

  <!-- Watermark / Title Text -->
  <text x="400" y="440" font-family="serif" font-size="18" font-weight="bold" fill="#D9A036" text-anchor="middle" letter-spacing="4" opacity="0.8">
    THE DEAD MAN'S CIPHER • NAVAL ENSIGN
  </text>
</svg>
